name: Build plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/*.test.mjs

  build:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.build.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4

      - name: Build every plugin under plugins/
        id: build
        run: |
          set -euo pipefail
          list=""
          for dir in plugins/*/; do
            name=$(basename "$dir")
            [ -f "$dir/manifest.json" ] || continue
            ./scripts/build.sh "$name"
            list="$list $name"
          done
          ls -l dist
          echo "plugins=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-xpi
          path: dist/*.xpi
          if-no-files-found: error

  release:
    # Only publish after a merge to main, never for PR builds.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugins-xpi
          path: dist

      - name: Publish a release per plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for xpi in dist/*.xpi; do
            base=$(basename "$xpi" .xpi)        # <plugin>-<version>
            tag="$base"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists - bump the version in manifest.json to publish a new one."
              continue
            fi
            gh release create "$tag" "$xpi" \
              --target "$GITHUB_SHA" \
              --title "$base" \
              --notes "Install via Zotero: Tools → Plugins → ⚙ → Install Plugin From File. Use at your own risk - see the README disclaimer."
          done

      # Zotero's built-in updater reads this per-plugin manifest (the plugin's
      # update_url points here), so installed copies update themselves.
      - name: Publish update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p updates
          for xpi in dist/*.xpi; do
            base=$(basename "$xpi" .xpi)
            plugin="${base%-*}"
            version="${base##*-}"
            python3 - "$plugin" "$version" "$base" <<'PY'
          import json, os, sys
          plugin, version, base = sys.argv[1:4]
          m = json.load(open(f"plugins/{plugin}/manifest.json"))
          z = m["applications"]["zotero"]
          link = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{base}/{base}.xpi"
          out = {"addons": {z["id"]: {"updates": [{
              "version": version,
              "update_link": link,
              "applications": {"zotero": {"strict_min_version": z["strict_min_version"]}},
          }]}}}
          json.dump(out, open(f"updates/{plugin}.json", "w"), indent=2)
          PY
          done
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --prerelease --target "$GITHUB_SHA" \
              --title "Update manifests" \
              --notes "Machine-readable files Zotero uses to auto-update plugins. Not an install package."
          fi
          gh release upload updates updates/*.json --clobber
